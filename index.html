<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/plsbvc7l/image/upload/c_fill,w_96,h_96,f_png/animall/catalogos-2026/logo-icono.jpg" />

    <title>Animall · Te ayudamos a consentir a tu mascota</title>
    <meta name="description" content="Tienda de mascotas en Plaza Las Américas. Alimento estándar, premium y super premium, snacks, farmacia, accesorios y grooming. Todos los productos con descuento: pide por WhatsApp." />
    <meta name="theme-color" content="#f3f3e9" />

    <!-- Open Graph / social (WhatsApp es el canal principal de compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Animall" />
    <meta property="og:title" content="Animall · Te ayudamos a consentir a tu mascota" />
    <meta property="og:description" content="Más de 400 productos para tu mascota, todos con descuento. Arma tu pedido y envíalo por WhatsApp." />
    <meta property="og:url" content="https://animall.vercel.app" />
    <meta property="og:image" content="https://res.cloudinary.com/plsbvc7l/image/upload/c_pad,w_1200,h_630,b_rgb:F3F3E9,f_jpg,q_auto/animall/catalogos-2026/portada-super-premium.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: siempre con <link>, nunca @import dentro del SCSS inyectado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Free por CDN; iconos como <i class="fa-solid fa-…"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  </body>
